<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master - Guia Acessível</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm py-2">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">G</div>
                <span class="font-bold text-xl tracking-tight text-slate-900">Guia<span class="text-indigo-600">Acessível</span></span>
                <span class="ml-2 text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Admin</span>
            </div>
            <button onclick="logout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-medium transition">Sair</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex justify-between items-center border-b border-slate-200 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">👑 Painel do Administrador</h1>
                <p class="text-xs text-slate-400">Gerencie todos os termos do dicionário</p>
            </div>
            <button onclick="showForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Novo Termo
            </button>
        </div>

        <!-- Formulário de cadastro -->
        <div id="formTermo" class="hidden bg-white rounded-xl border border-slate-200 p-6 shadow-sm mb-6">
            <h3 class="text-md font-bold text-slate-900 mb-4">➕ Cadastrar Novo Termo</h3>
            <form onsubmit="salvarTermo(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Termo *</label>
                        <input type="text" id="termoNome" required class="w-full text-sm p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria</label>
                        <input type="text" id="termoCategoria" placeholder="Ex: Neurodiversidade" class="w-full text-sm p-2.5 border border-slate-200 rounded-lg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Significado *</label>
                        <textarea id="termoSignificado" rows="3" required class="w-full text-sm p-2.5 border border-slate-200 rounded-lg"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Imagem Ilustrativa</label>
                        <div class="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center cursor-pointer hover:bg-slate-50" id="uploadArea">
                            <input type="file" id="imagemUpload" class="hidden" accept="image/*" onchange="previewImagem(event)">
                            <label for="imagemUpload" class="cursor-pointer text-sm text-indigo-600">📸 Clique para fazer upload</label>
                            <div id="previewContainer" class="hidden mt-2">
                                <img id="imgPreview" src="" class="h-24 mx-auto rounded border">
                                <button type="button" onclick="removerImagem()" class="text-red-500 text-xs mt-1">Remover</button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Dica de Aplicação *</label>
                        <textarea id="termoDicaAplicacao" rows="2" required class="w-full text-sm p-2.5 border border-slate-200 rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Dica de Assimilação *</label>
                        <textarea id="termoDicaAssimilacao" rows="2" required class="w-full text-sm p-2.5 border border-slate-200 rounded-lg"></textarea>
                    </div>
                </div>
                <div class="flex gap-2 mt-4 justify-end">
                    <button type="button" onclick="hideForm()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">Salvar Termo</button>
                </div>
            </form>
        </div>

        <!-- Lista de termos -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="p-4 border-b border-slate-100">
                <h3 class="text-md font-bold text-slate-900">📚 Termos Cadastrados</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <th class="p-4">Termo</th>
                            <th class="p-4">Categoria</th>
                            <th class="p-4">Significado</th>
                            <th class="p-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTermos" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
