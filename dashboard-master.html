<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Guia Acessível</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <span class="text-2xl">📝</span>
                </div>
                <h2 class="text-xl font-bold text-slate-900">Criar conta gratuita</h2>
                <p class="text-slate-400 text-xs mt-1">Comece sua jornada pela inclusão</p>
            </div>

            <form onsubmit="handleCadastro(event)">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nome completo</label>
                        <input type="text" id="cadNome" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">E-mail</label>
                        <input type="email" id="cadEmail" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Senha (mínimo 6 caracteres)</label>
                        <input type="password" id="cadSenha" required minlength="6" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition">Cadastrar</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <p class="text-xs text-slate-500">
                    Já tem conta? 
                    <a href="index.html" class="text-indigo-600 hover:text-indigo-700 font-medium">Faça login</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
