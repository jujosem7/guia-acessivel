<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Acessível</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- TÍTULO -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3">G</div>
            <h1 class="text-3xl font-bold text-slate-900">Guia<span class="text-indigo-600">Acessível</span></h1>
            <p class="text-slate-400">Dicionário inclusivo</p>
        </div>

        <!-- ==================== TELA DE LOGIN ==================== -->
        <div id="loginScreen" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-center mb-6">Acessar plataforma</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="inputEmail" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="inputSenha" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button id="btnEntrar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition">Entrar</button>
                <button id="btnCadastrar" class="w-full border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-medium py-2.5 rounded-xl transition">Cadastrar</button>
            </div>
            
            <p class="text-center text-xs text-slate-400 mt-6">Admin: admin@guiaacessivel.com / 123456</p>
        </div>

        <!-- ==================== TELA DE CADASTRO ==================== -->
        <div id="cadastroScreen" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-center mb-6">Criar conta</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
                    <input type="text" id="inputNome" class="w-full px-4 py-2 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="inputEmailCad" class="w-full px-4 py-2 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha (mínimo 6)</label>
                    <input type="password" id="inputSenhaCad" class="w-full px-4 py-2 border border-slate-200 rounded-xl">
                </div>
                <button id="btnSalvarCadastro" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition">Cadastrar</button>
                <button id="btnVoltarLogin" class="w-full border border-slate-300 text-slate-600 hover:bg-slate-50 font-medium py-2.5 rounded-xl transition">Voltar</button>
            </div>
        </div>

        <!-- ==================== TELA HOME (USUÁRIO COMUM) ==================== -->
        <div id="homeScreen" class="hidden">
            <div class="flex justify-end mb-4">
                <button id="btnSairHome" class="text-red-500 text-sm hover:text-red-700">Sair</button>
            </div>
            
            <div class="max-w-2xl mx-auto text-center">
                <input type="text" id="inputBusca" placeholder="Digite um termo (ex: TEA, Libras)..." class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-3">
                <button id="btnBuscar" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2 rounded-xl transition">Buscar</button>
            </div>

            <div id="resultadoArea" class="max-w-2xl mx-auto mt-8 bg-white rounded-xl p-6 hidden">
                <div id="conteudoResultado"></div>
            </div>
        </div>

        <!-- ==================== TELA MASTER ==================== -->
        <div id="masterScreen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">👑 Painel Administrador</h2>
                <button id="btnSairMaster" class="text-red-500 text-sm hover:text-red-700">Sair</button>
            </div>
            
            <div class="bg-white rounded-2xl p-6 mb-6 shadow-sm">
                <h3 class="font-bold text-lg mb-4">➕ Adicionar Novo Termo</h3>
                <div class="grid gap-3">
                    <input type="text" id="novoTermo" placeholder="Termo" class="p-3 border rounded-xl">
                    <input type="text" id="novaCategoria" placeholder="Categoria (ex: Neurodiversidade)" class="p-3 border rounded-xl">
                    <textarea id="novoSignificado" placeholder="Significado" rows="3" class="p-3 border rounded-xl"></textarea>
                    <textarea id="novaDicaAplicacao" placeholder="Dica de aplicação" rows="2" class="p-3 border rounded-xl"></textarea>
                    <textarea id="novaDicaAssimilacao" placeholder="Dica de assimilação" rows="2" class="p-3 border rounded-xl"></textarea>
                    <button id="btnSalvarTermo" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl transition">Salvar Termo</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="bg-slate-50 p-3 border-b">
                    <h3 class="font-bold">📚 Termos Cadastrados</h3>
                </div>
                <div id="listaTermosArea" class="divide-y"></div>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://ecidvrmrcpjmhieztdpo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaWR2cm1yY3BqbWhpZXp0ZHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDI1NTYsImV4cCI6MjA5NjYxODU1Nn0.0pNLW2C6IGcVzRhxa0wAiyj54F1_Lxi4V4wLsM2Qi94';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let usuarioAtual = null;

        // ==================== TESTE DE CONEXÃO ====================
        console.log('Iniciando aplicação...');
        
        // ==================== FUNÇÕES DE TELA ====================
        function mostrarLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('cadastroScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('masterScreen').classList.add('hidden');
        }
        
        function mostrarCadastro() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('cadastroScreen').classList.remove('hidden');
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('masterScreen').classList.add('hidden');
        }
        
        function mostrarHome() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('cadastroScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            document.getElementById('masterScreen').classList.add('hidden');
        }
        
        function mostrarMaster() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('cadastroScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('masterScreen').classList.remove('hidden');
            carregarTermos();
        }
        
        // ==================== LOGIN ====================
        async function fazerLogin() {
            const email = document.getElementById('inputEmail').value;
            const senha = document.getElementById('inputSenha').value;
            
            if (!email || !senha) {
                alert('Preencha e-mail e senha');
                return;
            }
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });
            
            if (error) {
                alert('Erro: ' + error.message);
                return;
            }
            
            usuarioAtual = data.user;
            const isMaster = data.user.user_metadata?.role === 'master';
            
            if (isMaster) {
                mostrarMaster();
            } else {
                mostrarHome();
            }
        }
        
        // ==================== CADASTRO ====================
        async function fazerCadastro() {
            const nome = document.getElementById('inputNome').value;
            const email = document.getElementById('inputEmailCad').value;
            const senha = document.getElementById('inputSenhaCad').value;
            
            if (!nome || !email || !senha) {
                alert('Preencha todos os campos');
                return;
            }
            
            if (senha.length < 6) {
                alert('Senha deve ter no mínimo 6 caracteres');
                return;
            }
            
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: senha,
                options: {
                    data: { nome: nome, role: 'user' }
                }
            });
            
            if (error) {
                alert('Erro: ' + error.message);
                return;
            }
            
            alert('✅ Cadastro realizado! Agora faça login.');
            mostrarLogin();
        }
        
        // ==================== LOGOUT ====================
        async function fazerLogout() {
            await supabase.auth.signOut();
            usuarioAtual = null;
            mostrarLogin();
        }
        
        // ==================== BUSCAR TERMO ====================
        async function buscarTermo() {
            const busca = document.getElementById('inputBusca').value;
            
            if (!busca) {
                alert('Digite um termo para buscar');
                return;
            }
            
            const { data, error } = await supabase
                .from('termos')
                .select('*')
                .ilike('termo', `%${busca}%`);
            
            if (error) {
                alert('Erro na busca: ' + error.message);
                return;
            }
            
            if (data && data.length > 0) {
                const termo = data[0];
                document.getElementById('conteudoResultado').innerHTML = `
                    <h3 class="text-xl font-bold text-indigo-600 mb-2">${termo.termo}</h3>
                    <p class="text-slate-600 mb-3"><strong>📖 Significado:</strong> ${termo.significado}</p>
                    <div class="bg-amber-50 p-3 rounded-lg mb-2"><strong>✨ Dica de aplicação:</strong> ${termo.dica_aplicacao}</div>
                    <div class="bg-indigo-50 p-3 rounded-lg"><strong>🧠 Como assimila:</strong> ${termo.dica_assimilacao}</div>
                `;
                document.getElementById('resultadoArea').classList.remove('hidden');
            } else {
                document.getElementById('conteudoResultado').innerHTML = '<p class="text-center text-slate-400">Nenhum termo encontrado</p>';
                document.getElementById('resultadoArea').classList.remove('hidden');
            }
        }
        
        // ==================== CARREGAR TERMOS (MASTER) ====================
        async function carregarTermos() {
            const { data, error } = await supabase
                .from('termos')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Erro ao carregar:', error);
                return;
            }
            
            let html = '';
            for (const termo of data) {
                html += `
                    <div class="flex justify-between items-center p-3 border-b hover:bg-slate-50">
                        <div>
                            <span class="font-medium">${termo.termo}</span>
                            <span class="text-xs text-slate-400 ml-2">${termo.categoria || ''}</span>
                        </div>
                        <button onclick="excluirTermo('${termo.id}')" class="text-red-500 text-sm hover:text-red-700">Excluir</button>
                    </div>
                `;
            }
            document.getElementById('listaTermosArea').innerHTML = html || '<div class="p-4 text-center text-slate-400">Nenhum termo cadastrado</div>';
        }
        
        // ==================== SALVAR TERMO (MASTER) ====================
        async function salvarTermo() {
            const termo = document.getElementById('novoTermo').value;
            const categoria = document.getElementById('novaCategoria').value;
            const significado = document.getElementById('novoSignificado').value;
            const dica_aplicacao = document.getElementById('novaDicaAplicacao').value;
            const dica_assimilacao = document.getElementById('novaDicaAssimilacao').value;
            
            if (!termo || !significado) {
                alert('Preencha Termo e Significado');
                return;
            }
            
            const { error } = await supabase
                .from('termos')
                .insert([{ termo, categoria, significado, dica_aplicacao, dica_assimilacao }]);
            
            if (error) {
                alert('Erro: ' + error.message);
                return;
            }
            
            alert('✅ Termo adicionado!');
            document.getElementById('novoTermo').value = '';
            document.getElementById('novaCategoria').value = '';
            document.getElementById('novoSignificado').value = '';
            document.getElementById('novaDicaAplicacao').value = '';
            document.getElementById('novaDicaAssimilacao').value = '';
            carregarTermos();
        }
        
        // ==================== EXCLUIR TERMO ====================
        window.excluirTermo = async function(id) {
            if (!confirm('Excluir este termo?')) return;
            
            const { error } = await supabase.from('termos').delete().eq('id', id);
            if (error) {
                alert('Erro ao excluir');
                return;
            }
            carregarTermos();
        };
        
        // ==================== VERIFICAR SESSÃO ====================
        async function verificarSessao() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                usuarioAtual = session.user;
                const isMaster = session.user.user_metadata?.role === 'master';
                if (isMaster) {
                    mostrarMaster();
                } else {
                    mostrarHome();
                }
            } else {
                mostrarLogin();
            }
        }
        
        // ==================== CONFIGURAR EVENTOS DOS BOTÕES ====================
        function configurarBotoes() {
            document.getElementById('btnEntrar').onclick = fazerLogin;
            document.getElementById('btnCadastrar').onclick = mostrarCadastro;
            document.getElementById('btnSalvarCadastro').onclick = fazerCadastro;
            document.getElementById('btnVoltarLogin').onclick = mostrarLogin;
            document.getElementById('btnSairHome').onclick = fazerLogout;
            document.getElementById('btnSairMaster').onclick = fazerLogout;
            document.getElementById('btnBuscar').onclick = buscarTermo;
            document.getElementById('btnSalvarTermo').onclick = salvarTermo;
        }
        
        // INICIAR
        configurarBotoes();
        verificarSessao();
    </script>
</body>
</html>
