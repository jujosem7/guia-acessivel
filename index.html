<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Guia Acessível - Dicionário Inclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm py-2">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="verificarAcesso()">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">G</div>
                <span class="font-bold text-xl tracking-tight text-slate-900">Guia<span class="text-indigo-600">Acessível</span></span>
            </div>
            
            <div class="flex gap-2 bg-slate-100 p-1 rounded-lg text-xs font-medium">
                <button id="btn-home" class="px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition">Início</button>
                <button id="btn-login" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">Entrar</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">

        <!-- TELA HOME -->
        <section id="screen-home" class="space-y-6">
            <div class="text-center max-w-2xl mx-auto space-y-2">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                    Desmistificando a inclusão
                </h1>
                <p class="text-slate-400 text-sm">
                    Pesquise termos e aprenda na prática
                </p>
                
                <div class="pt-2 relative max-w-xl mx-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>
                    <input type="text" id="searchInputHome" placeholder="Digite um termo (ex: TEA, Libras)..." class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl bg-white shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <button onclick="searchTerm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition w-full sm:w-auto">Buscar</button>
            </div>

            <div>
                <h2 class="text-md font-bold text-slate-900 mb-3">⭐ Termos em destaque</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="destaquesContainer"></div>
            </div>

            <div class="bg-indigo-900 rounded-xl p-4 text-white shadow-lg">
                <div class="flex items-start gap-3">
                    <span class="text-2xl">💡</span>
                    <div>
                        <h3 class="text-sm font-bold">Dica do dia</h3>
                        <p class="text-indigo-100 text-xs leading-relaxed" id="dicaTexto">Faça login para acessar as dicas</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-500 uppercase mb-2">Sugestões de busca</h3>
                <div class="flex flex-wrap gap-2" id="sugestoesContainer"></div>
            </div>
        </section>

        <!-- TELA DE LOGIN -->
        <section id="screen-login" class="hidden max-w-md mx-auto">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-7 h-7 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900">Acessar plataforma</h2>
                    <p class="text-slate-400 text-xs mt-1">Faça login para pesquisar termos</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">E-mail</label>
                            <input type="email" id="loginEmail" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Senha</label>
                            <input type="password" id="loginPassword" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition">Entrar</button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-xs text-slate-500">
                        Ainda não tem conta? 
                        <button onclick="window.location.href='cadastro.html'" class="text-indigo-600 hover:text-indigo-700 font-medium">Cadastre-se</button>
                    </p>
                </div>
            </div>
        </section>

        <!-- TELA DE DETALHE -->
        <section id="screen-detail" class="hidden max-w-3xl mx-auto space-y-4">
            <button onclick="showScreen('home')" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-800 gap-1">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Voltar
            </button>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm" id="detalhesContainer"></div>
        </section>

    </main>

    <footer class="bg-white border-t border-slate-200 mt-6 py-3 text-center text-xs text-slate-400">
        <div class="max-w-7xl mx-auto px-4">© 2026 GuiaAcessível - Inclusão para todos</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
